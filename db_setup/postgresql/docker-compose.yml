version: '3.8'

services:
  sql-iq-postgres:
    image: postgres:14
    container_name: sql-iq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - sql_iq_pgdata:/var/lib/postgresql/data
    shm_size: '256mb'
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c work_mem=16MB

volumes:
  sql_iq_pgdata:
    driver: local
