version: "2.2"

volumes:
  metadata_data: {}
  middle_var: {}
  historical_var: {}
  broker_var: {}
  coordinator_var: {}
  router_var: {}
  druid_shared: {}

services:
  druid-postgres:
    container_name: druid-postgres
    image: postgres:17
    ports:
      - "5434:5432"
    volumes:
      - metadata_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=FoolishPassword
      - POSTGRES_USER=druid
      - POSTGRES_DB=druid

  zookeeper:
    container_name: zookeeper
    image: zookeeper:3.5.10
    ports:
      - "2181:2181"
    environment:
      - ZOO_MY_ID=1

  coordinator:
    image: apache/druid:35.0.1
    container_name: coordinator
    volumes:
      - druid_shared:/opt/shared
      - coordinator_var:/opt/druid/var
      - .:/opt/data
    depends_on:
      - zookeeper
      - druid-postgres
    ports:
      - "8181:8081"
    command:
      - coordinator
    env_file:
      - environment

  broker:
    image: apache/druid:35.0.1
    container_name: broker
    volumes:
      - broker_var:/opt/druid/var
      - .:/opt/data
    depends_on:
      - zookeeper
      - druid-postgres
      - coordinator
    ports:
      - "8082:8082"
    command:
      - broker
    env_file:
      - environment

  historical:
    image: apache/druid:35.0.1
    container_name: historical
    volumes:
      - druid_shared:/opt/shared
      - historical_var:/opt/druid/var
      - .:/opt/data
    depends_on:
      - zookeeper
      - druid-postgres
      - coordinator
    ports:
      - "8083:8083"
    command:
      - historical
    env_file:
      - environment

  middlemanager:
    image: apache/druid:35.0.1
    container_name: middlemanager
    volumes:
      - druid_shared:/opt/shared
      - middle_var:/opt/druid/var
      - .:/opt/data
    depends_on:
      - zookeeper
      - druid-postgres
      - coordinator
    ports:
      - "8091:8091"
      - "8100-8105:8100-8105"
    command:
      - middleManager
    env_file:
      - environment

  router:
    image: apache/druid:35.0.1
    container_name: router
    volumes:
      - router_var:/opt/druid/var
      - .:/opt/data
    depends_on:
      - zookeeper
      - druid-postgres
      - coordinator
    ports:
      - "8888:8888"
    command:
      - router
    env_file:
      - environment
